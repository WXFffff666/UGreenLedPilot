name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure wizard dir exists
        run: |
          # fnpack requires the wizard/ directory, and tests assert it exists.
          # Git does not track empty directories, so it must be created
          # explicitly after checkout — before the unit tests run.
          mkdir -p src/wizard
          ls -la src/wizard

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fnpack
        run: |
          curl -fsSL https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o fnpack
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Clean Python caches
        run: |
          # Unit tests import the server modules, leaving __pycache__ that
          # must not be packaged into the fpk.
          find src -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find src -name '*.pyc' -delete 2>/dev/null || true

      - name: Build ugreen_leds_cli
        run: |
          docker run --platform linux/amd64 --rm \
            -v "$PWD/src/app/server":/output \
            -w /build alpine:latest sh -c '
              set -e
              apk add --no-cache git g++ make linux-headers
              git clone --depth 1 https://github.com/miskcoo/ugreen_leds_controller.git
              cd ugreen_leds_controller
              git fetch --depth 1 origin af2b7ae84f65a8730768d4b626570bc824b196e0
              git checkout af2b7ae84f65a8730768d4b626570bc824b196e0
              test "$(git rev-parse HEAD)" = "af2b7ae84f65a8730768d4b626570bc824b196e0"
              cd cli && make
              cp ugreen_leds_cli /output/
            '

      - name: Sync manifest version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version[[:space:]]*=.*/version               = ${VERSION}/" src/manifest
          echo "Manifest version set to: ${VERSION}"
          grep '^version' src/manifest

      - name: Build fpk
        working-directory: src
        run: fnpack build

      - name: Collect artifact
        run: |
          VERSION=$(grep '^version' src/manifest | awk -F= '{print $2}' | tr -d ' ')
          mkdir -p build
          cp src/UGreenLedPilot.fpk "build/UGreenLedPilot-${VERSION}.x86_64.fpk"

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: UGreenLedPilot-fpk
          path: build/*.fpk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.fpk
          generate_release_notes: true
