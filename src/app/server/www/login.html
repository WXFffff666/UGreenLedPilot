<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - UGreenLedPilot</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <div class="login-wrap">
    <form class="login-box" id="login-form">
      <div class="logo lg" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#041018"><circle cx="12" cy="12" r="8"/></svg>
      </div>
      <h2>UGreenLedPilot</h2>
      <p>DXP4800 Plus · 管理员登录</p>
      <input id="pw" type="password" placeholder="管理员密码" autocomplete="current-password" required>
      <button type="submit" class="abtn p full">登录</button>
      <p class="login-hint">默认密码 admin123，首次登录后请修改</p>
    </form>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
